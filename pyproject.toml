[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aliexpress-coin-collector"
version = "0.9.1"
description = "Sammelt den taeglichen AliExpress-Coin-Check-in automatisch ein (Android per ADB + OCR)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "pytesseract>=0.3.10",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/fgrfn/aliexpress-coin-collector"
Issues = "https://github.com/fgrfn/aliexpress-coin-collector/issues"

[project.scripts]
aliexpress-coin-collector = "aliexpress_coin_collector.__main__:main"

# find statt einer festen Liste: sonst fehlt das Unterpaket web in einer Installation.
[tool.setuptools.packages.find]
include = ["aliexpress_coin_collector*"]

# Vorlagen und mitgelieferte Dateien sind kein Beiwerk -- ohne sie startet die Oberflaeche nicht.
[tool.setuptools.package-data]
"aliexpress_coin_collector.web" = ["templates/*.html", "templates/**/*.html", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# damit auch ein blosses "pytest" das Paket findet, nicht nur "python -m pytest"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# FastAPI erwartet File() und Form() als Vorgabewert im Funktionskopf. Das ist der
# vorgesehene Weg, kein veraenderliches Standardargument.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
