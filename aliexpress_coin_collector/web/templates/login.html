{% extends "plain.html" %}
{% block content %}
<section class="card">
  <h1>Anmelden</h1>
  {% if error %}<p class="bad" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <div class="field" style="margin-top: 16px;">
      <label for="pw">Passwort</label>
      <input id="pw" type="password" name="password" autocomplete="current-password" autofocus required>
    </div>
    <button class="btn" type="submit" style="width: 100%; margin-top: 16px;">Anmelden</button>
  </form>
</section>
{% endblock %}
{% block foot %}Die Oberfläche gehört ins LAN, nicht ins Internet.{% endblock %}
