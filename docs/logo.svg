<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">AliExpress Coin Collector</title>
  <desc id="desc">Vector logo with smartphone, coin, tap gesture and automation circuit motif.</desc>
  <defs>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a00"/>
      <stop offset="0.5" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#ef1f1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe66a"/>
      <stop offset="0.45" stop-color="#ffc21d"/>
      <stop offset="1" stop-color="#f28a00"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4a5"/>
      <stop offset="1" stop-color="#ffbe22"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303542"/>
      <stop offset="1" stop-color="#141821"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- orbital automation swoosh -->
  <path d="M190 545 C245 360 470 272 705 321 C905 362 1020 486 984 618 C953 731 791 789 585 777 C383 766 230 696 198 604"
        fill="none" stroke="url(#hot)" stroke-width="58" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- circuit branches -->
  <g fill="none" stroke="url(#hot)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M822 435 C932 410 955 340 962 277"/>
    <path d="M850 495 C950 478 1010 418 1035 360"/>
    <path d="M867 555 C965 550 1016 516 1060 470"/>
  </g>
  <g fill="#ffb52b" stroke="#ff6a00" stroke-width="8">
    <circle cx="968" cy="247" r="42"/>
    <circle cx="1052" cy="335" r="38"/>
    <circle cx="1081" cy="458" r="36"/>
  </g>
  <g fill="#ffe67d">
    <circle cx="968" cy="247" r="17"/>
    <circle cx="1052" cy="335" r="15"/>
    <circle cx="1081" cy="458" r="14"/>
  </g>

  <!-- phone -->
  <g transform="rotate(7 590 420)" filter="url(#shadow)">
    <rect x="382" y="110" width="420" height="650" rx="66" fill="url(#dark)"/>
    <rect x="414" y="150" width="356" height="565" rx="48" fill="#fffaf2"/>
    <rect x="530" y="124" width="124" height="18" rx="9" fill="#5d6472"/>

    <!-- app header -->
    <rect x="468" y="205" width="250" height="142" rx="38" fill="url(#hot)"/>
    <path d="M515 253 C525 313 646 318 666 248" fill="none" stroke="#fff" stroke-width="20" stroke-linecap="round"/>

    <!-- UI line -->
    <rect x="457" y="371" width="272" height="28" rx="14" fill="#dadde3"/>

    <!-- coin -->
    <circle cx="595" cy="525" r="105" fill="url(#gold)" stroke="#f29a00" stroke-width="12"/>
    <circle cx="595" cy="525" r="76" fill="#ffb719" stroke="#e78600" stroke-width="7"/>
    <path d="M595 468 L615 507 L659 513 L627 544 L635 588 L595 568 L555 588 L563 544 L531 513 L575 507 Z"
          fill="url(#gold2)" stroke="#fff0a0" stroke-width="5" stroke-linejoin="round"/>

    <!-- coin rays -->
    <g stroke="#ffb000" stroke-width="16" stroke-linecap="round">
      <path d="M595 389 v-25"/>
      <path d="M472 424 l-20 -22"/>
      <path d="M718 424 l21 -22"/>
      <path d="M455 527 h-28"/>
      <path d="M736 527 h28"/>
    </g>
  </g>

  <!-- tap pointer -->
  <g filter="url(#shadow)" transform="translate(0 5)">
    <path d="M596 545 C585 526 576 507 566 489 C556 471 563 450 580 442 C596 434 615 441 623 457 L655 518
             C665 507 681 503 694 510 C706 499 726 500 738 512 C752 504 772 510 781 525
             L821 592 C835 616 827 649 802 663 L735 700 C705 717 668 706 651 677 L589 572 C581 559 585 548 596 545 Z"
          fill="#fffaf2" stroke="#1c222e" stroke-width="16" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif">
    <text x="600" y="925" font-size="154" font-weight="800" fill="url(#hot)" letter-spacing="-5">AliExpress</text>
    <text x="600" y="1060" font-size="112" font-weight="800" fill="#1d222c" letter-spacing="-3">Coin Collector</text>
  </g>
</svg>
