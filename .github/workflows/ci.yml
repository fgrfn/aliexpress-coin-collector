name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Abhaengigkeiten
        # ruff ist fest gepinnt, damit neue Regeln einer neueren Version die CI nicht unangekündigt rot machen
        run: pip install -r requirements.txt "pytest>=8" "ruff==0.15.8" "httpx>=0.27"
      - name: Codeprüfung (ruff)
        run: ruff check .
      - name: Formatierung (ruff)
        run: ruff format --check .
      - name: Tests
        run: python -m pytest -q
      - name: shellcheck installieren
        # Feste Version, damit lokal und in der CI dieselben Regeln gelten. Die Version aus dem
        # Runner-Image wechselt sonst unangekuendigt und meldet plötzlich neue Befunde.
        run: |
          VER=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${VER}/shellcheck-${VER}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install -m 0755 "shellcheck-${VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
      - name: Installationsskript prüfen
        run: |
          bash -n install.sh
          shellcheck install.sh
